name: rag-agent

services:
  postgres:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      # 容器内通过 compose 服务名访问，覆盖 .env 里的 127.0.0.1 地址
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-local_demo_password}@postgres:5432/${POSTGRES_DB:-rag_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        # Next.js 的 rewrite 目标在构建时写入，使用 compose 内部服务名
        API_PROXY_TARGET: http://api:8000
    restart: "no"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
